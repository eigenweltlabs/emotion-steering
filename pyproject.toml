[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-steering"
version = "0.1.0"
description = "Extract and serve activation-based emotion steering vectors (Konen et al. 2024) for any HF causal LM."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "emotion-steering contributors" }]
keywords = ["llm", "steering", "caa", "interpretability", "vllm", "transformers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.26",
    "datasets>=2.14",
    "scikit-learn>=1.3",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "rich>=13",
]

[project.optional-dependencies]
vllm = ["vllm>=0.20,<0.21"]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
emotion-steering = "emotion_steering.cli:app"

[project.urls]
Repository = "https://github.com/eigenweltlabs/emotion-steering"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emotion_steering = ["serve/_patches/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a CUDA GPU",
    "model: tests that download/load a model",
]
